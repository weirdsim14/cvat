# Local overrides for this host (DGX Spark, aarch64):
# - host port 8080 is taken -> publish CVAT on 8090
# - mount the shared annotation-data dir as the CVAT "connected file share",
#   so the same imagery can also be used from Label Studio (port 8093)
services:
  traefik:
    ports: !override
      - 8090:8080

  # Match any Host header so CVAT is reachable via Tailscale IP / LAN IP,
  # not just localhost (upstream rules pin Host to ${CVAT_HOST}).
  cvat_server:
    labels:
      traefik.http.routers.cvat.rule:
        PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`)
          || PathPrefix(`/django-rq`)
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_ui:
    labels:
      traefik.http.routers.cvat-ui.rule: PathPrefix(`/`)
      traefik.http.routers.cvat-ui.priority: "1"
  cvat_worker_import:
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_worker_export:
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_worker_annotation:
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_worker_chunks:
    volumes:
      - cvat_share:/home/django/share:ro

volumes:
  cvat_share:
    driver_opts:
      type: none
      device: /home/sangcheol/Project/annotation-data
      o: bind
